name: deeplakesound
services:
  - name: web
    github:
      branch: vite-express-migration
      repo: YOUR_GITHUB_ORG/deeplakesound
    build_command: npm run build
    run_command: npm start
    http_port: 8080
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
    source_dir: .
