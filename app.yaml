name: deeplakesound
services:
  - name: web
    github:
      branch: vite-express-migration
      repo: YOUR_GITHUB_ORG/deeplakesound
    build_command: cd client && npm install && npm run build && cd ../server && npm install
    run_command: cd server && npm start
    http_port: 3000
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
    source_dir: .
